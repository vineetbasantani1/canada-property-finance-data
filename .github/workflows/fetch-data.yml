name: Fetch data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * 1"   # Mondays 10:17 UTC

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Bank of Canada rates
        run: python fetch_boc.py
      - name: Statistics Canada tables
        run: python fetch_statcan.py
      - name: Open-data catalogue
        run: python discover_open_data.py
        continue-on-error: true
      - name: Build Nova Scotia housing report
        run: python analysis/ns_housing_report.py
        continue-on-error: true
      - name: Build people vs homes report
        run: python analysis/people_vs_homes.py
        continue-on-error: true
      - name: Build what drives rent report
        run: python analysis/what_drives_rent.py
        continue-on-error: true
      - name: Build real rent factors report
        run: python analysis/real_rent_factors.py
        continue-on-error: true
      - name: Build Halifax supply gap report
        run: python analysis/halifax_supply_gap.py
        continue-on-error: true
      - name: Commit updated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "Data refresh $(date -u +%F)"
          git push
